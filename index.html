<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ZJUT AI 宣传部 · 素材</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/logo-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#FFFFFF; --ink:#111110; --ink-2:#6B6A65; --ink-3:#9A9992;
    --line:#EAE9E5; --code-bg:#FAFAF8;
    --grad:linear-gradient(90deg,#DDAEFF 0%,#1A87FF 100%);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  .grad-line{height:2px;background:var(--grad);flex:none}

  main{flex:1;display:flex;align-items:center}
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:56px 32px}

  .who{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-3);letter-spacing:.04em}
  .mark{width:16px;height:16px;border-radius:4px;background:var(--grad);flex:none}

  h1{
    margin:22px 0 14px;
    font-size:clamp(28px,4.3vw,38px);
    line-height:1.32;letter-spacing:-.025em;font-weight:600;
  }
  .sub{margin:0 0 30px;max-width:470px;font-size:15px;color:var(--ink-2)}

  /* 提示词代码块 */
  .prompt{
    margin:0;padding:20px 22px;max-height:260px;overflow:auto;
    background:var(--code-bg);border:1px solid var(--line);border-radius:14px;
    font-family:var(--mono);font-size:12.5px;line-height:1.95;color:#4E4D48;
    white-space:pre-wrap;word-break:break-word;
    scrollbar-width:thin;scrollbar-color:#D8D7D1 transparent;
  }
  .prompt::-webkit-scrollbar{width:6px}
  .prompt::-webkit-scrollbar-thumb{background:#DEDDD7;border-radius:3px}

  .act{display:flex;align-items:center;gap:20px;margin-top:22px;flex-wrap:wrap}
  button{
    font:inherit;cursor:pointer;border:0;
    height:48px;padding:0 24px;border-radius:999px;
    background:var(--ink);color:#fff;font-size:15px;font-weight:500;
    transition:transform .16s ease,background .16s ease;
  }
  button:hover{background:#000;transform:translateY(-1px)}
  button.done{background:#2F6B3A}
  .repo{font-size:14.5px;color:var(--ink-2);text-decoration:none;transition:color .16s}
  .repo:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}

  .hint{margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}

  footer{padding:0 0 26px}
  footer .wrap{padding-top:0;padding-bottom:0;display:flex}
  .path{font-family:var(--mono);font-size:11.5px;color:#B4B3AC}

  @media (max-width:640px){
    .wrap{padding:36px 22px}
    h1{margin-top:18px}
    .act{gap:16px}
    button{width:100%}
  }
</style>
</head>
<body>
<div class="grad-line"></div>

<main>
  <div class="wrap">
    <div class="who"><span class="mark"></span>ZJUT AI 宣传部</div>

    <h1>做推文，素材从这个仓库拿。</h1>
    <p class="sub">协会的 logo、配色、怎么用，都写在里面。不用下载、不用转存，也不用问人要图。</p>

    <pre class="prompt" id="prompt">协会推文和物料的素材，只从这个仓库取：
https://github.com/Ljh15224052032/zjutai-brand

动手前读 README.md 和 guidelines.md：logo 用哪版、配色、留白、哪些不能做，都写在里面，按它执行。
不要另找素材，不要改品牌色。</pre>

    <div class="act">
      <button id="copyBtn">复制提示词</button>
      <a class="repo" href="https://github.com/Ljh15224052032/zjutai-brand" target="_blank" rel="noopener">打开仓库</a>
    </div>

    <p class="hint">粘给 AI 就行，它会自己去仓库里读。</p>
  </div>
</main>

<footer>
  <div class="wrap"><span class="path">github.com/Ljh15224052032/zjutai-brand</span></div>
</footer>

<script>
(function () {
  var btn = document.getElementById('copyBtn');
  var src = document.getElementById('prompt');
  var text = src.textContent.trim();
  var timer = null;

  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function done(ok) {
    clearTimeout(timer);
    btn.textContent = ok ? '已复制' : '复制失败，请手动选中';
    btn.classList.add('done');
    timer = setTimeout(function () {
      btn.textContent = '复制提示词';
      btn.classList.remove('done');
    }, 2200);
  }

  btn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback()); });
    } else {
      done(fallback());
    }
  });
})();
</script>
</body>
</html>
